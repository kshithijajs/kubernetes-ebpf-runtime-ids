apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --no-cache-dir flask &&
              cat > /tmp/app.py <<'PY'
              from flask import Flask, request

              app = Flask(__name__)

              @app.route("/")
              def hello():
                  return "Backend Alive\n"

              @app.route("/secret")
              def secret():
                  return "Very Secret Data\n"

              @app.route("/collect", methods=["POST"])
              def collect():
                  data = request.get_data()
                  return f"received {len(data)} bytes\n"

              app.run(host="0.0.0.0", port=5000)
              PY
              python /tmp/app.py
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
spec:
  selector:
    app: backend
  ports:
    - port: 5000
