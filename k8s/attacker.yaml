apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: demo
spec:
  containers:
    - name: attacker
      image: ubuntu:24.04
      command:
        - /bin/sh
        - -c
      args:
        - |
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl dnsutils findutils gzip iproute2 netcat-openbsd \
            postgresql-client procps tar &&
          sleep infinity
      stdin: true
      tty: true
